<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  
<div class="container-fluid mt-3">
  <h1>Three equal width columns</h1>
  <div class="row">
    <div class="col p-3 bg-primary text-white">Col1</div>
    <div class="col p-3 bg-dark text-white">col2</div>
    <div class="col p-3 bg-success text-white">col3</div>
    <div class="col p-3 bg-danger text-white">col4</div>
    <div class="col p-3 bg-warning text-white">col5</div>
  </div>
</div>
</body>
</html>
